name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=jevdroid --cov-report=term-missing
      - run: jevdroid demo
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m build
      - name: Install wheel outside source tree
        run: |
          python -m venv /tmp/jevdroid-wheel
          /tmp/jevdroid-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/jevdroid-wheel/bin/jevdroid demo
