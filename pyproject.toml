[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jevdroid"
version = "0.1.0"
description = "Text-first Android agents powered by Jev."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "JevDroid contributors"}]
keywords = ["android", "agents", "jev", "adb", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1,<0.29", "defusedxml>=0.7.1,<0.8"]

[project.optional-dependencies]
android = ["uiautomator2==3.7.0"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2", "types-defusedxml>=0.7"]

[project.scripts]
jevdroid = "jevdroid.cli:main"

[project.urls]
Repository = "https://github.com/antiyro/jevdroid"
Issues = "https://github.com/antiyro/jevdroid/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/jevdroid"]

[[tool.mypy.overrides]]
module = ["uiautomator2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["jevdroid"]
